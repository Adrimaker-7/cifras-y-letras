
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cifras y Letras - Retos</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101827;color:white;font-family:Arial,sans-serif;text-align:center}
header{padding:25px 10px;font-size:30px;font-weight:bold;color:#5eead4}
button,input{font:inherit;border:0;border-radius:12px;padding:14px}
button{cursor:pointer;font-weight:bold}
#menu{padding:20px}
.mode{display:block;margin:18px auto;width:90%;max-width:350px;background:#14b8a6;color:#062b2b;font-size:22px}
#game{display:none;padding:10px 12px 30px}
.nav{display:flex;justify-content:center;align-items:center;gap:22px;margin:15px auto 35px}
.arrow{background:#334155;color:white;font-size:25px}
#num{font-size:35px;font-weight:bold}
.card{max-width:850px;margin:auto;background:#1e293b;border-radius:24px;padding:30px 12px;min-height:300px}
#category{color:#5eead4;font-size:24px}
#instruction{font-size:20px;margin:25px 0;color:#e2e8f0}
#matches{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;min-height:100px}
.digit{width:64px;height:105px}
.segment{stroke:#9b6737;stroke-width:1}
.operator{font-size:40px;font-weight:bold;padding:0 3px}
#back{margin:25px;background:#334155;color:white}
#prev:disabled,#next:disabled{opacity:.3}
@media(max-width:500px){.digit{width:42px;height:75px}.operator{font-size:30px}.card{padding:24px 5px}}
</style>
</head>
<body>
<header>🎮 CENTRO DE RETOS</header>

<div id="menu">
  <p>Elige una categoría</p>
  <button class="mode" onclick="start('C')">🔢 CIFRAS</button>
  <button class="mode" onclick="start('L')">🔤 LETRAS</button>
  <button class="mode" onclick="start('R')">🔥 RETOS CON CERILLAS</button>
  <p>Prueba inicial:</p>
  <input id="startNumber" type="number" min="1" max="100" value="1"
         style="width:180px;text-align:center">
</div>

<div id="game">
  <div class="nav">
    <button class="arrow" id="prev" onclick="move(-1)">◀</button>
    <div>
      <div style="color:#94a3b8">NIVEL</div>
      <div id="num">001</div>
    </div>
    <button class="arrow" id="next" onclick="move(1)">▶</button>
  </div>
  <main class="card">
    <div id="category"></div>
    <div id="instruction"></div>
    <div id="matches"></div>
  </main>
  <button id="back" onclick="back()">← MENÚ</button>
</div>

<script>
let mode='R', level=1;

const digits = {
  0:'abcdef', 1:'bc', 2:'abged', 3:'abgcd',
  4:'fgbc', 5:'afgcd', 6:'afgecd', 7:'abc',
  8:'abcdefg', 9:'abfgcd'
};

function svgDigit(n){
  const segments={
    a:[12,8,42,8], b:[54,12,54,43], c:[54,51,54,82],
    d:[12,86,42,86], e:[8,51,8,82], f:[8,12,8,43],
    g:[12,47,42,47]
  };
  let out='<svg class="digit" viewBox="0 0 65 95" aria-label="'+n+'">';
  for(const s of digits[n]){
    const p=segments[s];
    const horizontal=['a','d','g'].includes(s);
    const points=horizontal
      ? `${p[0]},${p[1]-3} ${p[2]-4},${p[3]-3} ${p[2]},${p[3]} ${p[0]+4},${p[1]}`
      : `${p[0]-3},${p[1]+4} ${p[0]},${p[1]} ${p[2]},${p[3]-4} ${p[2]-3},${p[3]}`;
    out+='<polygon class="segment" fill="#f4d28b" points="'+points+'"/>';
    out+='<circle cx="'+(horizontal?(p[0]+3):(p[0]-1))+'" cy="'+(horizontal?p[1]-1:(p[1]+4))+'" r="1.5" fill="#b86b3d"/>';
  }
  return out+'</svg>';
}

function validDigit(segments){
  for(let n=0;n<=9;n++){
    if(digits[n].split('').sort().join('')===segments.split('').sort().join(''))return n;
  }
  return -1;
}

/* Genera retos moviendo exactamente una cerilla entre dos cifras. */
function buildPuzzles(){
  const puzzles=[];
  const seen=new Set();
  for(let a=0;a<=9;a++){
    for(let b=0;b<=9;b++){
      const c=a+b;
      if(c>9)continue;
      const original=[a,b,c];
      for(let from=0;from<3;from++){
        for(let to=0;to<3;to++){
          if(from===to)continue;
          for(const seg of digits[original[from]]){
            const source=digits[original[from]].replace(seg,'');
            const newSource=validDigit(source);
            if(newSource<0)continue;
            for(const add of 'abcdefg'){
              if(digits[original[to]].includes(add))continue;
              const newTarget=validDigit(digits[original[to]]+add);
              if(newTarget<0)continue;
              const result=original.slice();
              result[from]=newSource;
              result[to]=newTarget;
              if(result[0]+result[1]===result[2])continue;
              const key=result.join('+')+'='+from+to;
              if(seen.has(key))continue;
              seen.add(key);
              puzzles.push({
                values:result,
                from:from,
                to:to,
                answer:original.join('+')+'='+c
              });
            }
          }
        }
      }
    }
  }
  return puzzles;
}

const puzzles=buildPuzzles();
const challenges=Array.from({length:100},(_,i)=>puzzles[i%puzzles.length]);

function start(m){
  mode=m;
  const requested=Number(document.getElementById('startNumber').value);
  level=Number.isInteger(requested)&&requested>=1&&requested<=100?requested:1;
  document.getElementById('menu').style.display='none';
  document.getElementById('game').style.display='block';
  render();
}
function move(n){
  level=Math.max(1,Math.min(100,level+n));
  render();
}
function back(){
  document.getElementById('game').style.display='none';
  document.getElementById('menu').style.display='block';
}
function render(){
  document.getElementById('num').textContent=String(level).padStart(3,'0');
  document.getElementById('prev').disabled=level===1;
  document.getElementById('next').disabled=level===100;
  const cat=document.getElementById('category');
  const inst=document.getElementById('instruction');
  const board=document.getElementById('matches');

  if(mode==='R'){
    cat.textContent='🔥 RETOS CON CERILLAS';
    inst.textContent='Mueve una cerilla para corregir la operación.';
    const p=challenges[level-1];
    board.innerHTML=
      svgDigit(p.values[0])+
      '<span class="operator">+</span>'+
      svgDigit(p.values[1])+
      '<span class="operator">=</span>'+
      svgDigit(p.values[2]);
  }else if(mode==='C'){
    cat.textContent='🔢 CIFRAS';
    inst.textContent='Modo de cifras';
    board.textContent='Integra aquí tus pruebas de cifras.';
  }else{
    cat.textContent='🔤 LETRAS';
    inst.textContent='Modo de letras';
    board.textContent='Integra aquí tus pruebas de letras.';
  }
}
document.addEventListener('keydown',e=>{
  if(document.getElementById('game').style.display==='block'){
    if(e.key==='ArrowLeft')move(-1);
    if(e.key==='ArrowRight')move(1);
  }
});
</script>
</body>
</html>
