
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cifras y Letras</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101827;color:white;font-family:Arial,sans-serif;text-align:center;padding:20px}
h1{color:#5eead4;font-size:32px}
.panel{max-width:600px;margin:20px auto;background:#1e293b;padding:25px;border-radius:20px}
button,select{border:0;border-radius:12px;padding:13px 20px;margin:5px;font-size:18px;cursor:pointer}
button{background:#14b8a6;color:#062b2b;font-weight:bold}
button:disabled{opacity:.3;cursor:default}
.modo{background:#334155;color:white}
.modo.activo{background:#14b8a6;color:#062b2b}
.numero{font-size:25px;color:#cbd5e1}
.datos{font-size:clamp(25px,5vw,38px);font-weight:bold;letter-spacing:2px;line-height:1.7;margin:25px 0;overflow-wrap:anywhere}
.objetivo{font-size:27px;color:#fbbf24;font-weight:bold}
.navegacion{display:flex;justify-content:center;align-items:center;gap:15px;margin-top:25px}
.navegacion button{font-size:25px;padding:10px 20px}
#posicion{font-size:19px;color:#cbd5e1}
</style>
</head>
<body>
<h1>🎮 CIFRAS Y LETRAS</h1>

<div class="panel">
<button id="btnC" class="modo activo" onclick="cambiarModo('C')">🔢 CIFRAS</button>
<button id="btnL" class="modo" onclick="cambiarModo('L')">🔤 LETRAS</button>

<div class="navegacion">
<button id="anterior" onclick="mover(-1)" aria-label="Prueba anterior">⬅</button>
<div>
<div class="numero">PRUEBA</div>
<div id="numero" style="font-size:38px;font-weight:bold">001</div>
</div>
<button id="siguiente" onclick="mover(1)" aria-label="Prueba siguiente">➡</button>
</div>

<div id="posicion">1 de 100</div>
</div>

<div class="panel">
<h2 id="titulo">🔢 CIFRAS</h2>
<div id="objetivo" class="objetivo">Objetivo: 256</div>
<div id="datos" class="datos">9 · 7 · 2 · 10 · 100 · 75</div>
<p id="nota">Utiliza los números para alcanzar el objetivo.</p>
</div>

<script>
let modo='C';
let prueba=1;

const cifras={
1:{o:256,n:[9,7,2,10,100,75]},
2:{o:535,n:[100,6,10,25,2,2]}
};

const letras={
1:['R','O','I','A','A','S','P','A','M'],
2:['U','T','P','T','A','A','E','L','N']
};

function cambiarModo(m){
modo=m;
prueba=1;
actualizar();
}

function mover(cambio){
prueba=Math.max(1,Math.min(100,prueba+cambio));
actualizar();
}

function actualizar(){
document.getElementById('btnC').classList.toggle('activo',modo==='C');
document.getElementById('btnL').classList.toggle('activo',modo==='L');

document.getElementById('numero').textContent=String(prueba).padStart(3,'0');
document.getElementById('posicion').textContent=prueba+' de 100';
document.getElementById('titulo').textContent=modo==='C'?'🔢 CIFRAS':'🔤 LETRAS';

document.getElementById('anterior').disabled=prueba===1;
document.getElementById('siguiente').disabled=prueba===100;

const id=String(prueba).padStart(3,'0');

if(modo==='C'){
const p=cifras[prueba];
document.getElementById('objetivo').textContent=p?'Objetivo: '+p.o:'Objetivo: —';
document.getElementById('datos').textContent=p?p.n.join(' · '):'Prueba pendiente de cargar';
document.getElementById('nota').textContent='Utiliza los números para alcanzar el objetivo.';
}else{
const p=letras[prueba];
document.getElementById('objetivo').textContent='Palabra más larga posible';
document.getElementById('datos').textContent=p?p.join(' · '):'Prueba pendiente de cargar';
document.getElementById('nota').textContent='Forma la palabra más larga que puedas.';
}
}

document.addEventListener('keydown',e=>{
if(e.key==='ArrowLeft')mover(-1);
if(e.key==='ArrowRight')mover(1);
});

actualizar();
</script>
</body>
</html>

</script>
</body>
</html>
