*{box-sizing:border-box}
body{margin:0;background:#101827;color:white;font-family:Arial,sans-serif;text-align:center}
header{padding:24px 10px;color:#5eead4;font-size:30px;font-weight:bold}
button,input{font:inherit;border:0;border-radius:12px;padding:14px}
button{cursor:pointer;font-weight:bold}
#inicio{padding:20px}
.modo{display:block;width:90%;max-width:350px;margin:18px auto;background:#14b8a6;color:#082b2b;font-size:22px}
.selector-menu{max-width:350px;margin:35px auto}
.selector-menu input{width:100%;margin:8px 0;text-align:center;font-size:22px}
.secundario{background:#334155;color:white}
#juego{display:none;padding:10px 15px 30px}
.selector{display:flex;align-items:center;justify-content:center;gap:25px;margin:15px auto 45px}
.flecha{background:#334155;color:white;font-size:27px;padding:12px 21px}
.flecha:disabled{opacity:.25}
.etiqueta{font-size:15px;color:#94a3b8}
#numero{font-size:35px;font-weight:bold}
#contenido{max-width:880px;min-height:325px;margin:auto;background:#1e293b;border-radius:24px;padding:40px 16px}
#tipo{font-size:25px;color:#5eead4}
#objetivo{font-size:29px;font-weight:bold;color:#fbbf24;margin:35px 0}
#datos{font-size:clamp(25px,5vw,38px);font-weight:bold;line-height:1.8;overflow-wrap:anywhere}
.volver{margin:30px auto;background:#334155;color:white;font-size:20px}
@media(max-width:500px){header{font-size:25px}#contenido{padding:30px 10px;min-height:260px}.selector{gap:16px}}
</style>

<div id="inicio">
  <p>¿Qué quieres jugar?</p>
  <div class="selector-menu">
    <label for="pruebaMenu">Número de prueba (001–100)</label>
    <input id="pruebaMenu" type="number" min="1" max="100" value="1">
  </div>
  <button class="modo" onclick="abrir('C')">🔢 CIFRAS</button>
  <button class="modo" onclick="abrir('L')">🔤 LETRAS</button>
</div>

<div id="juego">
  <div class="selector">
    <button class="flecha" id="anterior" onclick="mover(-1)">◀</button>
    <div><div class="etiqueta">PRUEBA</div><div id="numero">001</div></div>
    <button class="flecha" id="siguiente" onclick="mover(1)">▶</button>
  </div>
  <main id="contenido">
    <div id="tipo"></div>
    <div id="objetivo"></div>
    <div id="datos"></div>
  </main>
  <button class="volver" onclick="volver()">← MENÚ</button>

function abrir(tipo) {
  const valor = Number(document.getElementById('pruebaMenu').value);
  if (!Number.isInteger(valor) || valor < 1 || valor > 100) {
    alert('Elige un número entre 1 y 100.');
    return;
  }
  modo = tipo;
  prueba = valor;
  document.getElementById('inicio').style.display = 'none';
  document.getElementById('juego').style.display = 'block';
  actualizar();
}

function mover(cambio) {
  prueba = Math.max(1, Math.min(100, prueba + cambio));
  document.getElementById('pruebaMenu').value = prueba;
  actualizar();
}

function volver() {
  document.getElementById('juego').style.display = 'none';
  document.getElementById('inicio').style.display = 'block';
}

function actualizar() {
  document.getElementById('numero').textContent = String(prueba).padStart(3,'0');
  document.getElementById('anterior').disabled = prueba === 1;
  document.getElementById('siguiente').disabled = prueba === 100;
  document.getElementById('tipo').textContent =
    modo === 'C' ? '🔢 CIFRAS' : '🔤 LETRAS';

  if (modo === 'C') {
    const p = cifras[prueba - 1];
    document.getElementById('objetivo').textContent = 'Objetivo: ' + p.objetivo;
    document.getElementById('datos').textContent = p.numeros.join(' · ');
  } else {
    const p = letrasTexto[prueba - 1];
    document.getElementById('objetivo').textContent = 'Palabra más larga posible';
    document.getElementById('datos').textContent = p.split('').join(' · ');
  }
}

document.addEventListener('keydown', e => {
  if (document.getElementById('juego').style.display === 'block') {
    if (e.key === 'ArrowLeft') mover(-1);
    if (e.key === 'ArrowRight') mover(1);
  }
});
